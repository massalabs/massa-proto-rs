[package]
name = "massa-proto-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Protobuf Rust bindings for the Massa blockchain"
repository = "https://github.com/massalabs/massa-proto-rs/"
homepage = "https://massa.net"
documentation = "https://docs.massa.net/"

include = ["api.bin"]

[lib]
name = "massa_proto_rs"

[dependencies]
prost = { version = "=0.14", default-features = false, features = [
    "derive",
] }
prost-types = { version = "=0.14", default-features = false }
tonic = { version = "0.14.9", optional = true }
tonic-prost = { version = "0.14.9", optional = true }

[build-dependencies]
glob = "0.3"
prost-build = "0.14"
tonic-prost-build = "0.14.9"
tower-service = "0.3.3"

[features]
tonic-build = []
tonic = ["dep:tonic", "dep:tonic-prost"] # enable or disable tonic support
